name: deploy-javacard

on:
  workflow_run:
    workflows: ["Java Card CI"]
    types: [completed]
  workflow_dispatch: {}   # garde la possibilité de relancer manuellement au besoin

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted,db2secJavaCard]
    steps:
      - name: Télécharger le .cap de la dernière release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ${{ github.repository }} --pattern '*.cap' --dir . --clobber

      - name: Repérer le fichier téléchargé
        id: cap
        run: echo "file=$(ls *.cap | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Désinstaller l'ancienne version si présente
        run: gp --uninstall "${{ steps.cap.outputs.file }}" || true

      - name: Installer la nouvelle version sur la JavaCard
        run: gp --install "${{ steps.cap.outputs.file }}"